<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101e34">
  <title>CrickVision | AI Vision Studio</title>
  <style>
    :root { color-scheme: light; --navy:#111f35; --teal:#0f8275; --muted:#607086; }
    * { box-sizing: border-box; }
    body { margin:0; background:#f1f5f9; color:var(--navy); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .topbar { min-height:75px; padding:16px max(24px,calc((100vw - 1320px)/2)); display:flex; align-items:center; justify-content:space-between; gap:16px; background:var(--navy); color:white; }
    .brand { display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; font-size:24px; font-weight:760; letter-spacing:-.65px; }
    .brand-icon { width:44px; height:44px; display:grid; place-items:center; border-radius:14px; background:#164c45; flex:0 0 44px; }
    .brand-icon svg { display:block; width:38px; height:38px; }
    .nav-info { display:flex; align-items:center; gap:15px; color:#c6d4e2; font-size:13px; }
    .nav-chip { background:#304057; color:#eef5ff; border-radius:40px; padding:7px 12px; font-weight:600; }
    main { width:min(100% - 36px,1220px); margin:28px auto 20px; }
    .workspace-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 2px 14px; }
    .eyebrow { display:flex; gap:9px; align-items:center; color:#405368; font-size:12px; font-weight:700; letter-spacing:1.15px; text-transform:uppercase; }
    .status-dot { display:inline-block; width:9px; height:9px; background:#129a87; box-shadow:0 0 0 4px #dcefea; border-radius:100%; }
    .open-link { color:#0b736b; font-size:13px; font-weight:650; text-decoration:none; padding:7px 0; }
    .open-link:hover { text-decoration:underline; }
    .framebox { background:#f7f9fc; border:1px solid #dce4ec; border-radius:22px; overflow:hidden; box-shadow:0 14px 34px rgba(23,42,67,.055); }
    iframe { display:block; width:100%; height:1100px; border:0; background:#f7f9fc; }
    footer { color:#6b788a; text-align:center; font-size:12px; line-height:1.6; padding:15px 12px 24px; }
    @media (max-width:700px) {
      .topbar { padding:13px 16px; min-height:68px; }
      .brand { font-size:20px; }
      .brand-icon { width:39px; height:39px; flex-basis:39px; border-radius:12px; }
      .brand-icon svg { width:34px; height:34px; }
      .nav-info > span:first-child { display:none; }
      .nav-chip { font-size:11px; padding:6px 9px; }
      main { width:calc(100% - 18px); margin-top:16px; }
      .workspace-bar { padding:0 5px; }
      .eyebrow { font-size:10px; letter-spacing:.7px; }
      .open-link { font-size:11px; }
      .framebox { border-radius:16px; }
      iframe { height:950px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="CrickVision home">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 88 88" xmlns="http://www.w3.org/2000/svg" role="img" focusable="false">
        <g stroke="#f5faff" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M17 34V25Q17 17 25 17H34 M54 17H63Q71 17 71 25V34 M17 54V63Q17 71 25 71H34 M54 71H63Q71 71 71 63V54"/>
          <path d="M34 32V59 M44 32V59 M54 32V59 M30 30H58"/>
        </g>
        <circle cx="65" cy="46" r="5.8" fill="#35c8ac"/>
      </svg></span>
      <span>CrickVision</span>
    </a>
    <div class="nav-info"><span>AI Vision Studio</span><span class="nav-chip">Capstone Project</span></div>
  </header>
  <main>
    <div class="workspace-bar">
      <div class="eyebrow"><span class="status-dot"></span>Cricket computer vision</div>
      <a class="open-link" href="https://crickvision-demo.streamlit.app/" target="_blank" rel="noopener noreferrer">Open full workspace ↗</a>
    </div>
    <div class="framebox">
      <iframe title="CrickVision model analysis" src="https://crickvision-demo.streamlit.app/?embed=true" allow="fullscreen" loading="eager"></iframe>
    </div>
    <footer>© 2026 CrickVision. Developed for academic research and demonstration.</footer>
  </main>
</body>
</html>
